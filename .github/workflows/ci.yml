name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run deterministic test suite
        shell: bash
        run: npm test
      - name: Verify generated CommonJS build is current
        shell: bash
        run: node scripts/build-cjs.mjs --check
      - name: Run CLI smoke test
        shell: bash
        run: node scripts/cli-smoke.mjs
      - name: Verify package tarball contents
        shell: bash
        run: npm pack --dry-run
