name: Feature request
description: Propose a feature or hardening improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What XML security or integration problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the API, default behavior and failure mode.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Explain whether this changes defaults, finding codes, AST shape, CLI output or TypeScript types.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: List positive, negative and boundary tests you expect.
