name: Bug report
description: Report incorrect behavior that is not a private security vulnerability
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security vulnerability, do not continue here. Use the private Security Advisories workflow described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: xmlcage version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.11.0
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Paste a small script or XML fixture. Remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Finding codes or error output
      description: Include exact codes such as XMLCAGE_MALFORMED_XML.
